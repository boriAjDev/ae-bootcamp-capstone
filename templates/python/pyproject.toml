[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "APP_NAME"
version = "0.1.0"
description = "APP_NAME Python Application"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
APP_NAME = "app_name.main:main"

[tool.setuptools.packages.find]
where = ["src"]
