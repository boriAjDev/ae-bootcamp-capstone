name: Create Repository from Request

on:
  issues:
    types: [labeled]

jobs:
  create-repo:
    if: github.event.label.name == 'repo-request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      # ------------------------------------------------------------------ #
      #  1. Check out this repo for the parser and scaffold templates       #
      # ------------------------------------------------------------------ #
      - name: Checkout capstone repo
        uses: actions/checkout@v4
        with:
          path: capstone

      # ------------------------------------------------------------------ #
      #  2. Parse the issue body                                            #
      # ------------------------------------------------------------------ #
      - name: Parse issue body
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const { parseRequest } = require(`${process.env.GITHUB_WORKSPACE}/capstone/scripts/parse-request.js`);
            const request = parseRequest(context.payload.issue.body);

            core.setOutput('repo_name',    request.repoName);
            core.setOutput('repo_org',     request.repoOrg);
            core.setOutput('app_type',     request.appType);
            core.setOutput('groups',       request.groups.join(','));
            core.setOutput('description',  request.description);

            core.info(`repo_name: ${request.repoName}`);
            core.info(`repo_org:  ${request.repoOrg}`);
            core.info(`app_type:  ${request.appType}`);
            core.info(`groups:    ${request.groups.join(',')}`);

      # ------------------------------------------------------------------ #
      #  3. Validate required fields                                        #
      # ------------------------------------------------------------------ #
      - name: Validate inputs
        id: validate
        env:
          REPO_NAME: ${{ steps.parse.outputs.repo_name }}
          REPO_ORG: ${{ steps.parse.outputs.repo_org }}
          APP_TYPE: ${{ steps.parse.outputs.app_type }}
          GROUPS: ${{ steps.parse.outputs.groups }}
        run: |

          ERRORS=""

          if [ -z "$REPO_NAME" ]; then
            ERRORS="$ERRORS\n- Repository Name is required."
          elif ! echo "$REPO_NAME" | grep -qE '^[a-z0-9][a-z0-9\-]*[a-z0-9]$'; then
            ERRORS="$ERRORS\n- Repository Name must be lowercase alphanumeric with hyphens (no leading/trailing hyphens)."
          fi

          if [ -z "$REPO_ORG" ]; then
            ERRORS="$ERRORS\n- Organization is required."
          fi

          if [[ "$APP_TYPE" != "dotnet" && "$APP_TYPE" != "java" && "$APP_TYPE" != "python" ]]; then
            ERRORS="$ERRORS\n- Application Type must be one of: dotnet, java, python. Got: '$APP_TYPE'."
          fi

          if [ -z "$GROUPS" ]; then
            ERRORS="$ERRORS\n- At least one Permission Group must be selected."
          fi

          if [ -n "$ERRORS" ]; then
            echo "VALIDATION_ERRORS<<EOF" >> $GITHUB_OUTPUT
            printf "%b" "$ERRORS" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "valid=false" >> $GITHUB_OUTPUT
          else
            echo "valid=true" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------ #
      #  4. Comment on issue if validation fails                            #
      # ------------------------------------------------------------------ #
      - name: Comment validation failure
        if: steps.validate.outputs.valid == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const errors = `${{ steps.validate.outputs.VALIDATION_ERRORS }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ Repository Request Failed — Validation Errors\n\nPlease fix the following issues and re-submit:\n${errors}`
            });

      - name: Fail on validation errors
        if: steps.validate.outputs.valid == 'false'
        run: exit 1

      # ------------------------------------------------------------------ #
      #  5. Create the new repository                                       #
      # ------------------------------------------------------------------ #
      - name: Create repository
        id: create
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
          REPO_NAME: ${{ steps.parse.outputs.repo_name }}
          REPO_ORG: ${{ steps.parse.outputs.repo_org }}
          DESCRIPTION: ${{ steps.parse.outputs.description }}
        run: |
          gh repo create "$REPO_ORG/$REPO_NAME" \
            --private \
            --description "$DESCRIPTION" \
            --confirm

          REPO_URL="https://github.com/$REPO_ORG/$REPO_NAME"
          echo "repo_url=$REPO_URL" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------ #
      #  6. Push scaffold template                                         #
      # ------------------------------------------------------------------ #
      - name: Push scaffold template
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
          REPO_NAME: ${{ steps.parse.outputs.repo_name }}
          REPO_ORG: ${{ steps.parse.outputs.repo_org }}
          APP_TYPE: ${{ steps.parse.outputs.app_type }}
        run: |
          # Clone the newly created empty repo
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/$REPO_ORG/$REPO_NAME.git" new-repo

          # Render into a staging directory so the scaffold transformation never walks .git
          bash capstone/scripts/render-template.sh "$APP_TYPE" "$REPO_NAME" scaffold
          cp -r scaffold/. new-repo/

          cd new-repo
          git add -A
          git commit -m "chore: initial scaffold for $APP_TYPE application"
          git push origin HEAD:main

      # ------------------------------------------------------------------ #
      #  7. Assign team permissions                                        #
      # ------------------------------------------------------------------ #
      - name: Assign team permissions
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
          REPO_NAME: ${{ steps.parse.outputs.repo_name }}
          REPO_ORG: ${{ steps.parse.outputs.repo_org }}
          GROUPS: ${{ steps.parse.outputs.groups }}
        run: |
          declare -A PERM_MAP
          PERM_MAP["devops"]="maintain"
          PERM_MAP["engineers"]="push"
          PERM_MAP["admins"]="admin"
          PERM_MAP["qa"]="pull"

          IFS=',' read -ra GROUP_LIST <<< "$GROUPS"
          for GROUP in "${GROUP_LIST[@]}"; do
            PERMISSION="${PERM_MAP[$GROUP]}"
            if [ -z "$PERMISSION" ]; then
              echo "Warning: Unknown group '$GROUP', skipping."
              continue
            fi
            echo "Assigning '$PERMISSION' permission to team '$GROUP'..."
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/orgs/$REPO_ORG/teams/$GROUP/repos/$REPO_ORG/$REPO_NAME" \
              -f permission="$PERMISSION" \
              || echo "Warning: Could not assign team '$GROUP' (team may not exist in org). Skipping."
          done

      # ------------------------------------------------------------------ #
      #  8. Comment success and close the issue                            #
      # ------------------------------------------------------------------ #
      - name: Comment success and close issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const repoUrl  = "${{ steps.create.outputs.repo_url }}";
            const repoName = "${{ steps.parse.outputs.repo_name }}";
            const appType  = "${{ steps.parse.outputs.app_type }}";
            const groups   = "${{ steps.parse.outputs.groups }}";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## ✅ Repository Created Successfully`,
                ``,
                `| Field | Value |`,
                `|-------|-------|`,
                `| **Repository** | [${repoName}](${repoUrl}) |`,
                `| **Application Type** | \`${appType}\` |`,
                `| **Permission Groups** | \`${groups}\` |`,
                ``,
                `The scaffold has been pushed to \`main\`. Happy coding! 🚀`
              ].join('\n')
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      # ------------------------------------------------------------------ #
      #  9. Comment failure                                                #
      # ------------------------------------------------------------------ #
      - name: Comment failure
        if: failure() && steps.validate.outputs.valid != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ Repository Creation Failed\n\nThe automated pipeline encountered an error. Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details and contact the DevOps team if the issue persists.`
            });
