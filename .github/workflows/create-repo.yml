name: Create Repository from Request

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  request:
    name: Parse and validate request
    if: github.event.label.name == 'repo-request'
    runs-on: ubuntu-latest
    outputs:
      repo_name: ${{ steps.request.outputs.repo_name }}
      owner_type: ${{ steps.request.outputs.owner_type }}
      organization: ${{ steps.request.outputs.organization }}
      app_type: ${{ steps.request.outputs.app_type }}
      groups: ${{ steps.request.outputs.groups }}
      description: ${{ steps.request.outputs.description }}
      permissions: ${{ steps.request.outputs.permissions }}
      target_owner: ${{ steps.owner.outputs.target_owner }}
      repo_url: ${{ steps.owner.outputs.repo_url }}

    steps:
      # ------------------------------------------------------------------ #
      #  1. Check out this repo for the parser and scaffold templates       #
      # ------------------------------------------------------------------ #
      - name: Checkout capstone repo
        uses: actions/checkout@v4
        with:
          path: capstone

      # ------------------------------------------------------------------ #
      #  2. Parse and validate the request                                  #
      # ------------------------------------------------------------------ #
      - name: Parse and validate request
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            const workspace = process.env.GITHUB_WORKSPACE;
            const { parseRequest } = require(`${workspace}/capstone/scripts/parse-request.js`);
            const { validateRequest } = require(`${workspace}/capstone/scripts/validate-request.js`);

            const result = validateRequest(parseRequest(context.payload.issue.body));
            core.setOutput('valid', String(result.valid));

            if (!result.valid) {
              core.setOutput('errors', result.errors.map((error) => `- ${error}`).join('\n'));
              core.warning(`Request rejected: ${result.errors.join(' ')}`);
              return;
            }

            const request = result.request;
            core.setOutput('repo_name', request.repoName);
            core.setOutput('owner_type', request.ownerType);
            core.setOutput('organization', request.organization ?? '');
            core.setOutput('app_type', request.appType);
            core.setOutput('groups', request.groups.join(','));
            core.setOutput('description', request.description);
            core.setOutput('permissions', JSON.stringify(request.permissions));

            core.summary
              .addHeading('Repository request', 3)
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Value', header: true }],
                ['Repository', request.repoName],
                ['Owner', request.organization ?? 'no organization (personal account)'],
                ['Application type', request.appType],
                ['Permission groups', request.groups.join(', ') || 'none'],
              ]);
            await core.summary.write();

      # ------------------------------------------------------------------ #
      #  3. Comment on issue if validation fails                            #
      # ------------------------------------------------------------------ #
      - name: Comment validation failure
        if: steps.request.outputs.valid == 'false'
        uses: actions/github-script@v7
        env:
          # Passed through env, never interpolated into the script body, because
          # the issue is attacker controlled.
          VALIDATION_ERRORS: ${{ steps.request.outputs.errors }}
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ❌ Repository Request Failed — Validation Errors',
                '',
                'No repository was created. To retry, fix the points below, then **remove the',
                '`repo-request` label and add it again** — re-adding is what starts the workflow.',
                '',
                process.env.VALIDATION_ERRORS,
                '',
                `[View workflow run](${runUrl})`,
              ].join('\n'),
            });

      - name: Fail on validation errors
        if: steps.request.outputs.valid == 'false'
        run: exit 1

      # ------------------------------------------------------------------ #
      #  4. Resolve the target owner                                        #
      # ------------------------------------------------------------------ #
      - name: Resolve target owner
        id: owner
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
          REPO_NAME: ${{ steps.request.outputs.repo_name }}
          OWNER_TYPE: ${{ steps.request.outputs.owner_type }}
          ORGANIZATION: ${{ steps.request.outputs.organization }}
        run: |
          if [ "$OWNER_TYPE" = "organization" ]; then
            TARGET_OWNER="$ORGANIZATION"
          else
            # 'n/a' was requested, so the repository is owned by the token's account.
            TARGET_OWNER="$(gh api user --jq .login)"
            echo "No organization requested. Target owner is the personal account '$TARGET_OWNER'."
          fi

          {
            echo "target_owner=$TARGET_OWNER"
            echo "repo_url=https://github.com/$TARGET_OWNER/$REPO_NAME"
          } >> "$GITHUB_OUTPUT"

  provision:
    name: Provision repository
    needs: request
    runs-on: ubuntu-latest
    # Keyed on the resolved target so two different issues requesting the same
    # repository cannot both pass the existence check.
    concurrency:
      group: provision-${{ needs.request.outputs.target_owner }}/${{ needs.request.outputs.repo_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout capstone repo
        uses: actions/checkout@v4
        with:
          path: capstone

      # ------------------------------------------------------------------ #
      #  5. Reject the request if the target already exists                 #
      # ------------------------------------------------------------------ #
      - name: Check target repository availability
        id: target
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
          REPO_NAME: ${{ needs.request.outputs.repo_name }}
          TARGET_OWNER: ${{ needs.request.outputs.target_owner }}
        run: |
          set +e
          RESPONSE="$(gh api "repos/$TARGET_OWNER/$REPO_NAME" 2>&1)"
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            EXISTS=true
          elif echo "$RESPONSE" | grep -q "HTTP 404"; then
            EXISTS=false
          else
            # A permissions or transport error must not be read as "available".
            echo "::error::Could not determine whether $TARGET_OWNER/$REPO_NAME exists: $RESPONSE"
            exit 1
          fi

          echo "Target $TARGET_OWNER/$REPO_NAME exists: $EXISTS"
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

      - name: Comment that the repository already exists
        if: steps.target.outputs.exists == 'true'
        uses: actions/github-script@v7
        env:
          REPO_NAME: ${{ needs.request.outputs.repo_name }}
          TARGET_OWNER: ${{ needs.request.outputs.target_owner }}
          REPO_URL: ${{ needs.request.outputs.repo_url }}
        with:
          script: |
            const { REPO_NAME, TARGET_OWNER, REPO_URL } = process.env;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ❌ Repository Request Rejected — Name Already Taken',
                '',
                `\`${TARGET_OWNER}/${REPO_NAME}\` already exists: ${REPO_URL}`,
                '',
                'Nothing was created or changed. This request is rejected rather than reused, because',
                'pushing a scaffold into an existing repository could overwrite work that is already there.',
                '',
                '**To continue, do one of the following:**',
                '',
                '1. Edit this issue with a different **Repository Name**, then remove the `repo-request` label and add it again.',
                `2. If \`${REPO_NAME}\` is already your project, no action is needed — use the existing repository.`,
                `3. If the existing repository is unwanted, ask an owner of \`${TARGET_OWNER}\` to delete or rename it, then remove and re-add the label.`,
                '',
                `[View workflow run](${runUrl})`,
              ].join('\n'),
            });

      - name: Fail on existing repository
        if: steps.target.outputs.exists == 'true'
        run: |
          echo "::error::Repository already exists. Request rejected without changes."
          exit 1

      # ------------------------------------------------------------------ #
      #  6. Reject the request if a requested team is missing               #
      # ------------------------------------------------------------------ #
      - name: Verify requested teams exist
        id: teams
        if: needs.request.outputs.owner_type == 'organization'
        uses: actions/github-script@v7
        env:
          ORGANIZATION: ${{ needs.request.outputs.organization }}
          PERMISSION_GROUPS: ${{ needs.request.outputs.groups }}
        with:
          github-token: ${{ secrets.REPO_CREATION_TOKEN }}
          script: |
            const org = process.env.ORGANIZATION;
            const groups = process.env.PERMISSION_GROUPS.split(',').filter(Boolean);
            const missing = [];

            for (const slug of groups) {
              try {
                await github.rest.teams.getByName({ org, team_slug: slug });
                core.info(`Team '${slug}' exists in ${org}.`);
              } catch (error) {
                if (error.status === 404) {
                  missing.push(slug);
                } else {
                  throw error;
                }
              }
            }

            core.setOutput('missing', missing.join(','));

      - name: Comment that a requested team is missing
        if: steps.teams.outputs.missing != ''
        uses: actions/github-script@v7
        env:
          ORGANIZATION: ${{ needs.request.outputs.organization }}
          MISSING_TEAMS: ${{ steps.teams.outputs.missing }}
        with:
          script: |
            const { ORGANIZATION, MISSING_TEAMS } = process.env;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const missing = MISSING_TEAMS.split(',');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ❌ Repository Request Rejected — Missing Team',
                '',
                `The following requested team(s) do not exist in \`${ORGANIZATION}\`:`,
                '',
                ...missing.map((team) => `- \`${team}\``),
                '',
                'The request was stopped **before** the repository was created, so nothing needs cleaning',
                'up. Granting access later is easy to forget, so the request is rejected instead of being',
                'provisioned with incomplete access.',
                '',
                '**To continue:** ask an owner of the organization to create the team, or edit this issue to',
                'select only existing groups, then remove the `repo-request` label and add it again.',
                '',
                `[View workflow run](${runUrl})`,
              ].join('\n'),
            });

      - name: Fail on missing team
        if: steps.teams.outputs.missing != ''
        run: |
          echo "::error::Requested team(s) do not exist. Request rejected before creating anything."
          exit 1

      # ------------------------------------------------------------------ #
      #  7. Create the new repository                                       #
      # ------------------------------------------------------------------ #
      - name: Create repository
        id: create
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
          REPO_NAME: ${{ needs.request.outputs.repo_name }}
          TARGET_OWNER: ${{ needs.request.outputs.target_owner }}
          DESCRIPTION: ${{ needs.request.outputs.description }}
        run: |
          gh repo create "$TARGET_OWNER/$REPO_NAME" \
            --private \
            --description "$DESCRIPTION"

      # ------------------------------------------------------------------ #
      #  8. Push scaffold template                                          #
      # ------------------------------------------------------------------ #
      - name: Push scaffold template
        id: scaffold
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATION_TOKEN }}
          REPO_NAME: ${{ needs.request.outputs.repo_name }}
          TARGET_OWNER: ${{ needs.request.outputs.target_owner }}
          APP_TYPE: ${{ needs.request.outputs.app_type }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/$TARGET_OWNER/$REPO_NAME.git" new-repo

          # Refuse to scaffold over existing commits, so a retry can never overwrite content.
          if git -C new-repo rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "::error::$TARGET_OWNER/$REPO_NAME already has commits. Refusing to overwrite it."
            exit 1
          fi

          # Render into a staging directory so the scaffold transformation never walks .git
          bash capstone/scripts/render-template.sh "$APP_TYPE" "$REPO_NAME" scaffold
          cp -r scaffold/. new-repo/

          cd new-repo
          git add -A
          git commit -m "chore: initial scaffold for $APP_TYPE application"
          git push origin HEAD:main

      # ------------------------------------------------------------------ #
      #  9. Assign team permissions and verify they took effect             #
      # ------------------------------------------------------------------ #
      - name: Assign and verify team permissions
        id: permissions
        if: needs.request.outputs.owner_type == 'organization'
        uses: actions/github-script@v7
        env:
          ORGANIZATION: ${{ needs.request.outputs.organization }}
          REPO_NAME: ${{ needs.request.outputs.repo_name }}
          PERMISSIONS_JSON: ${{ needs.request.outputs.permissions }}
        with:
          github-token: ${{ secrets.REPO_CREATION_TOKEN }}
          script: |
            const workspace = process.env.GITHUB_WORKSPACE;
            const { evaluateAssignments, describeFailures } =
              require(`${workspace}/capstone/scripts/team-permissions.js`);

            const org = process.env.ORGANIZATION;
            const repo = process.env.REPO_NAME;
            const requested = JSON.parse(process.env.PERMISSIONS_JSON);

            // An assignment error is fatal: partial access must never look like success.
            for (const { group, permission } of requested) {
              core.info(`Assigning '${permission}' to team '${group}'...`);
              await github.rest.teams.addOrUpdateRepoPermissionsInOrg({
                org,
                team_slug: group,
                owner: org,
                repo,
                permission,
              });
            }

            // Read back what GitHub actually granted rather than trusting the writes.
            const observed = {};
            for (const { group } of requested) {
              try {
                const response = await github.request(
                  'GET /orgs/{org}/teams/{team_slug}/repos/{owner}/{repo}',
                  {
                    org,
                    team_slug: group,
                    owner: org,
                    repo,
                    headers: { accept: 'application/vnd.github.v3.repository+json' },
                  },
                );
                observed[group] = response.data.role_name ?? null;
              } catch (error) {
                if (error.status === 404) {
                  observed[group] = null;
                } else {
                  throw error;
                }
              }
            }

            const evaluation = evaluateAssignments(requested, observed);

            core.summary.addHeading('Team permissions', 3).addTable([
              [
                { data: 'Team', header: true },
                { data: 'Requested', header: true },
                { data: 'Effective', header: true },
                { data: 'Status', header: true },
              ],
              ...evaluation.results.map((result) => [
                result.group,
                result.expected,
                result.actual ?? 'none',
                result.status,
              ]),
            ]);
            await core.summary.write();

            core.setOutput('failures', describeFailures(evaluation.results).join('\n'));

            if (!evaluation.ok) {
              core.setFailed(
                `Requested access was not applied: ${describeFailures(evaluation.results).join('; ')}`,
              );
            }

      # ------------------------------------------------------------------ #
      #  10. Report outcome                                                 #
      # ------------------------------------------------------------------ #
      - name: Publish stage summary
        if: always()
        uses: actions/github-script@v7
        env:
          REPO_NAME: ${{ needs.request.outputs.repo_name }}
          TARGET_OWNER: ${{ needs.request.outputs.target_owner }}
          CREATE_RESULT: ${{ steps.create.conclusion }}
          SCAFFOLD_RESULT: ${{ steps.scaffold.conclusion }}
          PERMISSIONS_RESULT: ${{ steps.permissions.conclusion }}
        with:
          script: |
            const { REPO_NAME, TARGET_OWNER } = process.env;

            core.summary
              .addHeading('Provisioning stages', 3)
              .addRaw(`Target: ${TARGET_OWNER}/${REPO_NAME}`)
              .addTable([
                [{ data: 'Stage', header: true }, { data: 'Result', header: true }],
                ['Create repository', process.env.CREATE_RESULT || 'not reached'],
                ['Push scaffold', process.env.SCAFFOLD_RESULT || 'not reached'],
                ['Assign permissions', process.env.PERMISSIONS_RESULT || 'not reached'],
              ]);
            await core.summary.write();

      - name: Comment success and close issue
        if: success()
        uses: actions/github-script@v7
        env:
          REPO_URL: ${{ needs.request.outputs.repo_url }}
          REPO_NAME: ${{ needs.request.outputs.repo_name }}
          TARGET_OWNER: ${{ needs.request.outputs.target_owner }}
          OWNER_TYPE: ${{ needs.request.outputs.owner_type }}
          APP_TYPE: ${{ needs.request.outputs.app_type }}
          PERMISSION_GROUPS: ${{ needs.request.outputs.groups }}
        with:
          script: |
            const {
              REPO_URL, REPO_NAME, TARGET_OWNER, OWNER_TYPE, APP_TYPE, PERMISSION_GROUPS,
            } = process.env;

            const isOrg = OWNER_TYPE === 'organization';
            const permissions = isOrg
              ? `\`${PERMISSION_GROUPS}\` (verified)`
              : 'not applied — the repository is not owned by an organization';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ✅ Repository Created Successfully',
                '',
                '| Field | Value |',
                '|-------|-------|',
                `| **Repository** | [${REPO_NAME}](${REPO_URL}) |`,
                `| **Owner** | \`${TARGET_OWNER}\` (${isOrg ? 'organization' : 'personal account'}) |`,
                `| **Application Type** | \`${APP_TYPE}\` |`,
                `| **Permission Groups** | ${permissions} |`,
                '',
                'The scaffold has been pushed to `main`. Happy coding! 🚀',
              ].join('\n'),
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Comment failure
        if: failure() && steps.target.outputs.exists != 'true' && steps.teams.outputs.missing == ''
        uses: actions/github-script@v7
        env:
          REPO_NAME: ${{ needs.request.outputs.repo_name }}
          TARGET_OWNER: ${{ needs.request.outputs.target_owner }}
          REPO_URL: ${{ needs.request.outputs.repo_url }}
          CREATE_RESULT: ${{ steps.create.conclusion }}
          SCAFFOLD_RESULT: ${{ steps.scaffold.conclusion }}
          PERMISSIONS_RESULT: ${{ steps.permissions.conclusion }}
          PERMISSION_FAILURES: ${{ steps.permissions.outputs.failures }}
        with:
          script: |
            const {
              REPO_NAME, TARGET_OWNER, REPO_URL,
              CREATE_RESULT, SCAFFOLD_RESULT, PERMISSIONS_RESULT, PERMISSION_FAILURES,
            } = process.env;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const label = (result) => ({
              success: '✅ completed',
              failure: '❌ failed',
              skipped: '⏭️ not reached',
            }[result] || '⏭️ not reached');

            const created = CREATE_RESULT === 'success';
            const permissionsFailed = PERMISSIONS_RESULT === 'failure';

            const detail = permissionsFailed && PERMISSION_FAILURES
              ? ['', '**Access that was not applied:**', '', ...PERMISSION_FAILURES.split('\n').map((line) => `- ${line}`)]
              : [];

            let nextAction;
            if (!created) {
              nextAction = [
                'No repository was created, so nothing needs cleaning up.',
                '',
                'To retry, remove the `repo-request` label and add it again.',
              ].join('\n');
            } else if (permissionsFailed) {
              nextAction = [
                `\`${TARGET_OWNER}/${REPO_NAME}\` exists and contains the scaffold, but the requested access`,
                `was not fully applied: ${REPO_URL}`,
                '',
                'Do **not** delete the repository. An operator should grant the missing access directly,',
                'then close this issue. See "Recovering from a Partial Failure" in the capstone README.',
              ].join('\n');
            } else {
              nextAction = [
                `\`${TARGET_OWNER}/${REPO_NAME}\` was created, but provisioning did not finish: ${REPO_URL}`,
                '',
                'Re-labelling alone will not fix this, because a request is rejected when the target',
                'already exists. An operator must either delete the repository and then remove and',
                're-add the `repo-request` label, or finish the remaining stages by hand.',
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ❌ Repository Creation Failed',
                '',
                'The request was valid, but provisioning did not complete.',
                '',
                '| Stage | Result |',
                '|-------|--------|',
                `| Create repository | ${label(CREATE_RESULT)} |`,
                `| Push scaffold | ${label(SCAFFOLD_RESULT)} |`,
                `| Assign permissions | ${label(PERMISSIONS_RESULT)} |`,
                ...detail,
                '',
                nextAction,
                '',
                `[View workflow run](${runUrl})`,
              ].join('\n'),
            });
